name: District maps update

on:
  schedule:
    # Mondays 06:00 Mountain (12:00 UTC; DST-safe enough — a 1-hour drift is
    # fine for a weekly job).
    - cron: "0 12 * * 1"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest district data
        run: npm run fetch-districts
        # Exit 3 = new plan detected (official shapefile links changed). The job
        # fails on purpose: a human must review the new plan and update
        # scripts/districts/sources.ts. See the error message for details.

      - name: Validate
        run: npm run validate-districts

      - name: Check for changes
        id: changed
        run: |
          if [ -z "$(git status --porcelain data/districts)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR + arm auto-merge
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "district-maps-bot"
          git config user.email "district-maps-bot@users.noreply.github.com"
          BRANCH="chore/district-maps-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add data/districts
          git commit -m "chore(districts): refresh district map data

          Automated weekly refresh (scripts/fetch-districts.ts).
          Auto-merges when CI is green (tsc/lint/build + validator).
          Review the diff before it merges if you get the chance."
          git push origin "$BRANCH"
          cat > /tmp/pr-body.md <<'EOF'
          Automated weekly refresh of the legislative district map data.

          **What changed:** run `git diff main` in this PR.

          **Auto-merge:** this PR arms auto-merge (squash) — it merges as
          soon as CI is green (tsc/lint/build + `validate-districts`). The
          auto-pull on the production box then lands the change within
          ~15 minutes, and the "Last checked / Last updated" notes on
          /legislators reflect it immediately. (A NEW redistricting plan
          never auto-merges: the fetch step fails the job on purpose and
          no PR is opened.)

          **Advisory review (before it merges, if you get the chance):**
          - [ ] `validate-districts` passed (it runs in CI)
          - [ ] Preview deployment of /legislators renders both maps + insets
          - [ ] If this is a NEW redistricting plan (planYear changed), update the
                "How Colorado's Districts Are Determined" copy in
                src/app/legislators/page.tsx to match the new plan's dates
          EOF
          PR_URL="$(gh pr create --title "District maps data refresh" --body-file /tmp/pr-body.md | tail -n 1)"
          PR_NUM="${PR_URL##*/}"
          gh pr merge --auto --squash "$PR_NUM"
          echo "Auto-merge armed (squash) on ${PR_URL} — merges when CI is green."
