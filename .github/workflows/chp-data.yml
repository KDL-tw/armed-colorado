name: CHP data update

on:
  schedule:
    # Tuesdays 06:00 Mountain (12:00 UTC).
    - cron: "0 12 * * 2"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest CHP data
        run: |
          npm run fetch-chp-crs
          npm run fetch-chp-reciprocity
          npm run fetch-chp-sheriffs

      - name: Validate
        run: |
          npm run validate-chp-reciprocity
          npm run validate-chp-sheriffs

      - name: Check for changes
        id: changed
        run: |
          if [ -z "$(git status --porcelain data/chp data/us-states)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR + arm auto-merge
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "chp-data-bot"
          git config user.email "chp-data-bot@users.noreply.github.com"
          BRANCH="chore/chp-data-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add data/chp data/us-states
          git commit -m "chore(chp): refresh concealed-carry data

          Automated weekly refresh (scripts/fetch-chp-*.ts).
          Auto-merges when CI is green (tsc/lint/build + validators).
          Review the diff before it merges if you get the chance."
          git push origin "$BRANCH"
          cat > /tmp/pr-body.md <<'EOF'
          Automated weekly refresh of the concealed-carry page data.

          **What changed:** run `git diff main` in this PR. The fetch
          scripts printed which page sections were affected (reciprocity
          map / sheriff map / statute list).

          **Auto-merge:** this PR arms auto-merge (squash) — it merges as
          soon as CI is green (tsc/lint/build + the CHP validators). The
          auto-pull on the production box then lands the change within
          ~15 minutes, and the "Last checked / Last updated" notes on
          /concealed-carry reflect it immediately.

          **Advisory review (before it merges, if you get the chance):**
          - [ ] `validate-chp-reciprocity` and `validate-chp-sheriffs` passed (they run in CI)
          - [ ] Preview deployment of /concealed-carry renders both maps + all five sections
          - [ ] If the statute list changed, the CRS summaries in data/chp/crs.json were re-verified against the new text
          EOF
          PR_URL="$(gh pr create --title "CHP data refresh" --body-file /tmp/pr-body.md | tail -n 1)"
          PR_NUM="${PR_URL##*/}"
          gh pr merge --auto --squash "$PR_NUM"
          echo "Auto-merge armed (squash) on ${PR_URL} — merges when CI is green."
